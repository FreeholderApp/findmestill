name: FindMeStill CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  conformance:
    name: Build and discovery conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - uses: https://data.forgejo.org/actions/setup-node@v6
        with:
          node-version: "24.15.0"
      - name: Locked dependency install
        run: npm ci --ignore-scripts
      - name: Protocol, relay and HTTPS tests
        run: npm test
      - name: Production build
        env:
          FINDMESTILL_REVISION: ${{ forgejo.sha }}
        run: npm run build
      - name: Exact production output
        run: |
          node -e 'const fs=require("node:fs"); const release=JSON.parse(fs.readFileSync("dist/release.json")); if(release.revision !== process.env.EXPECTED_REVISION) process.exit(1)'
          tar -tzf dist/source.tar.gz > /tmp/findmestill-sources.txt
          grep -Fx findmestill/public/spec/discovery-v0.1.md /tmp/findmestill-sources.txt
          grep -Fx findmestill/public/fixtures/discovery-v0.1.json /tmp/findmestill-sources.txt
          grep -Fx findmestill/public/spec/protected-media-v1.md /tmp/findmestill-sources.txt
          grep -Fx findmestill/player/player.mjs /tmp/findmestill-sources.txt
          test -e dist/media/index.html
          test ! -e dist/player
        env:
          EXPECTED_REVISION: ${{ forgejo.sha }}
